name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libfontconfig1 libglib2.0-0
          python -m pip install --upgrade pip
          pip install pytest reportlab pyqtgraph PySide6
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m wififortress.app.main --selftest

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot python3 file
          chmod +x packaging/debian/*.sh packaging/debian/wifi-fortress-launcher
          ./packaging/debian/build_deb.sh
      - name: Verify the package metadata
        run: |
          dpkg-deb --info packaging/debian/wifi-fortress_*_all.deb
          dpkg-deb --contents packaging/debian/wifi-fortress_*_all.deb | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: packaging/debian/*.deb
