name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyside6.qtwidgets libegl1 libgl1 libxkbcommon-x11-0 \
                                  libdbus-1-3 libxcb-cursor0
          python -m pip install --upgrade pip
          pip install pytest reportlab pyqtgraph PySide6
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m wififortress.app.main --selftest

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot python3
          ./packaging/debian/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: packaging/debian/*.deb
